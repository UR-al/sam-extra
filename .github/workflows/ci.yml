name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Forge Classic runs on Python 3.13 (modules/launch_utils.py warns on anything else).
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch keeps the install small and fast; the tests never
          # touch CUDA. Everything else the suite imports is in requirements-dev.txt
          # (the same file local runs use).
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt

      # Same command as local runs (README). unittest prints "OK (skipped=N)" so
      # skipped tests stay visible in the log.
      - name: Run Python tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Check JavaScript syntax
        run: |
          for f in javascript/*.js; do
            echo "node --check $f"
            node --check "$f"
          done

      # Syntax checks cannot catch a listener bound to the wrong node or a pane
      # that never hides, so the frontend behaviour is exercised in jsdom.
      - name: Install frontend test dependencies
        run: npm ci --no-audit --no-fund

      - name: Run frontend behaviour tests
        run: npm test

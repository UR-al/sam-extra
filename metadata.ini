# Forge takes this extension's canonical name from its FOLDER name (modules/extensions.py),
# so the [callbacks/forge_sam3_extension/...] section below only applies when the extension
# lives in extensions/forge_sam3_extension. Clone it into that folder (see README);
# scripts/!sam3.py logs a warning at startup when the folder name differs.
[callbacks/forge_sam3_extension/!sam3.py/app_started/notebook-and-sampler-load-guard]
Before = sd-webui-rk-sampler/rk_sampler.py/app_started sd-webui-tde-sampler/tde_sampler.py/app_started

[scripts/anima_lora_blocks.py]
After = sd_forge_lora

# Built-in NegPiP keeps the place the standalone sd-forge-negpip had: after sd-dynamic-thresholding ("sd-d..." sorts
# before "sd-f..."). Dynamic Thresholding's process_batch renames p.sampler_name to '<name>_dynthres<N>', and NegPiP's
# process_batch picks the cond/uncond half from p.sampler_name (UniPC is special-cased) - it must see the renamed one,
# as it always did. Forge (modules/scripts.py list_scripts) expands an extension name here to all of that extension's
# scripts; a name that is not installed or not enabled is ignored. negpip.py still sorts after our anima_* scripts.
# Side effect of Forge's topological sort: Dynamic Thresholding's script now loads right before negpip.py, i.e. ahead
# of extensions whose folder names sort between ours and it (their default callback order relative to it changes).
# Checked with img2img-hires-fix, model-keyword, Tiled Diffusion, sd-dynamic-prompts: none has process_batch, and
# Tiled Diffusion's postprocess_batch only resets its own ControlNet tensors. tests/test_negpip_load_order.py runs
# Forge's own list_scripts on this file.
[scripts/negpip.py]
After = sd-dynamic-thresholding

# Anima VAE DeGrid runs in postprocess_image_after_composite, i.e. after every script's
# postprocess_image (ADetailer, SAM3 ...). Put it ahead of the Extras operations that
# Settings can enable in the txt2img/img2img tabs (Upscale): upscaling changes the grid pitch.
[callbacks/forge_sam3_extension/anima_vae_degrid.py/script_postprocess_image_after_composite/AnimaVaeDegrid]
Before = base/postprocessing_upscale.py/script_postprocess_image_after_composite/ScriptPostprocessingForMainUI
